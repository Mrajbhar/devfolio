proxy_cache_path /var/cache/nginx/leetcode levels=1:2 keys_zone=leetcode:1m max_size=10m inactive=7d use_temp_path=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/leetcode {
        limit_except GET { deny all; }

        rewrite ^ /graphql?query=%7BmatchedUser%28username%3A%22Mrajbhar%22%29%7BsubmitStatsGlobal%7BacSubmissionNum%7Bdifficulty%20count%7D%7D%20userCalendar%7BtotalActiveDays%20submissionCalendar%7D%7D%7D? break;
        proxy_pass https://leetcode.com;
        proxy_ssl_server_name on;
        proxy_set_header Host leetcode.com;
        proxy_set_header Referer https://leetcode.com;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;

        proxy_cache leetcode;
        proxy_cache_key "leetcode-stats";
        proxy_cache_valid 200 15m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
